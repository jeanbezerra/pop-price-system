spring.application.name=pop-price-system-service
spring.profiles.default=dev
spring.sql.init.mode=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pop_database_db}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.schema=pop_price_system_service
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.data-source-properties.ApplicationName=pop-price-system-service
spring.datasource.hikari.data-source-properties.socketTimeout=120
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.mvc.problemdetails.enabled=true

server.servlet.context-path=/pop-price-system-service
server.shutdown=graceful
server.tomcat.threads.max=${HTTP_THREADS:32}
server.error.include-message=never
server.error.include-stacktrace=never

springdoc.use-fqn=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.group.readiness.include=readinessState,db

logging.structured.format.console=logstash
ratecard.aws.endpoint-region=${AWS_PRICING_REGION:us-east-1}
ratecard.sync.stale-after-seconds=${SYNC_STALE_AFTER_SECONDS:300}

#---
spring.config.activate.on-profile=(dev | hml) & !prd
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true
