spring:
  application:
    name: pop-price-system-service
  profiles:
    default: dev
  sql:
    init:
      mode: never
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pop_database_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        ApplicationName: pop-price-system-service
        socketTimeout: 120
        tcpKeepAlive: true
  mvc:
    problemdetails:
      enabled: true
server:
  servlet:
    context-path: /pop-price-system-service
  shutdown: graceful
  tomcat:
    threads:
      max: ${HTTP_THREADS:32}
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  use-fqn: true
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
ratecard:
  aws:
    endpoint-region: ${AWS_PRICING_REGION:us-east-1}
  sync:
    stale-after-seconds: ${SYNC_STALE_AFTER_SECONDS:300}
---
spring:
  config:
    activate:
      on-profile: "(dev | hml) & !prd"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    use-root-path: true
